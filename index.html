<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Sistema Estoque</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #09090b; color: #fafafa; font-family: system-ui, sans-serif; }
  .card { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 20px; transition: all 0.2s; }
  .card:hover { border-color: #3f3f46; transform: translateY(-2px); }
  .card-menu:hover { border-color: #00D26A; background: #1c1c1f; cursor: pointer; }
  .hidden { display: none !important; }
</style>
</head>
<body class="min-h-screen">

<!-- LOGIN -->
<div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-green-600 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3">S</div>
      <h1 class="text-2xl font-bold">Sistema de Estoque</h1>
      <p class="text-zinc-500 text-sm mt-1">Faça login para continuar</p>
    </div>
    <div class="card">
      <input id="email" type="email" placeholder="seu@email.com" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 mb-3 outline-none focus:border-green-600 text-white">
      <input id="pass" type="password" placeholder="Senha (mín. 6 caracteres)" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-3 mb-4 outline-none focus:border-green-600 text-white">
      
      <!-- SEM onclick inline. Usaremos IDs e addEventListener no JS -->
      <button type="button" id="btnLogin" class="w-full bg-green-600 hover:bg-green-700 py-3 rounded-lg font-bold mb-2 text-white transition">Entrar</button>
      <button type="button" id="btnSignup" class="w-full bg-zinc-800 hover:bg-zinc-700 py-3 rounded-lg text-sm text-white transition">Criar conta</button>
      
      <p id="msg" class="text-sm mt-3 text-center text-zinc-400 min-h-[20px]"></p>
    </div>
  </div>
</div>

<!-- APP -->
<div id="appSection" class="hidden">
  <nav class="bg-zinc-900 border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center font-bold">S</div>
      <span class="font-bold">Estoque</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="userEmail" class="text-xs text-zinc-400"></span>
      <button type="button" id="btnLogout" class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1.5 rounded-lg transition">Sair</button>
    </div>
  </nav>

  <main class="p-4 max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold mb-1">Dashboard</h1>
    <p class="text-zinc-500 text-sm mb-6">Bem-vindo, escolha uma função abaixo</p>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8" id="stats">
      <div class="card"><div class="text-zinc-400 text-xs">Carregando...</div></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div onclick="location.href='produtos.html'" class="card card-menu">
        <div class="flex items-start justify-between">
          <div class="w-12 h-12 bg-blue-600/20 border border-blue-600/30 rounded-xl flex items-center justify-center text-2xl">📦</div>
          <span class="text-xs bg-zinc-800 px-2 py-1 rounded">Produtos</span>
        </div>
        <h3 class="font-bold text-lg mt-3">Produtos</h3>
        <p class="text-sm text-zinc-400 mt-1">Cadastro, edição, estoque e geração de QR Code</p>
      </div>
      <!-- Adicione os outros cards aqui conforme seu original -->
    </div>

    <div class="card mt-8">
      <h2 class="font-bold mb-3">Últimas movimentações</h2>
      <div id="lista" class="text-sm text-zinc-400">Nenhuma movimentação ainda</div>
    </div>
  </main>
</div>

<script>
// Aguarda TODO o HTML ser carregado antes de executar qualquer coisa
document.addEventListener('DOMContentLoaded', () => {
  console.log("🚀 Página carregada. Iniciando sistema...");

  // 1. Verifica se o Supabase carregou
  if (typeof window.supabase === 'undefined') {
    alert("ERRO: A biblioteca do Supabase foi bloqueada (AdBlock?). Desative e recarregue a página.");
    return;
  }

  const SUPABASE_URL = "https://zyjonbvxmsvgcexahusj.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5am9uYnZ4bXN2Z2NleGFodXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDg0ODEsImV4cCI6MjEwMjc4NDQ4MX0.5KrFCYI2Nv2U0dPqe6OmhxdCQLeI47wswNsgDqO4bok";
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  console.log("✅ Supabase conectado.");

  // Função auxiliar para mensagens
  function showMessage(text, isError = false) {
    const msgEl = document.getElementById('msg');
    if (msgEl) {
      msgEl.textContent = text;
      msgEl.className = `text-sm mt-3 text-center ${isError ? 'text-red-400 font-bold' : 'text-green-400'}`;
    }
    if (isError) console.error("Erro:", text);
    else console.log("Info:", text);
  }

  // 2. CONFIGURAÇÃO DOS BOTÕES (Substitui o onclick do HTML)
  const btnLogin = document.getElementById('btnLogin');
  const btnSignup = document.getElementById('btnSignup');
  const btnLogout = document.getElementById('btnLogout');

  if (btnLogin) {
    btnLogin.addEventListener('click', async () => {
      console.log("🖱️ Botão Entrar clicado!");
      const e = document.getElementById('email').value.trim();
      const p = document.getElementById('pass').value;
      
      if (!e || !p) return showMessage("Preencha e-mail e senha.", true);

      showMessage("Entrando...");
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email: e, password: p });
        if (error) throw error;
        showMessage("Logado com sucesso!");
        setTimeout(() => checkAuth(), 500);
      } catch (err) {
        showMessage("Erro no login: " + err.message, true);
      }
    });
  }

  if (btnSignup) {
    btnSignup.addEventListener('click', async () => {
      console.log("🖱️ Botão Criar Conta clicado!");
      const e = document.getElementById('email').value.trim();
      const p = document.getElementById('pass').value;
      
      if (!e || !p) return showMessage("Preencha e-mail e senha.", true);
      if (p.length < 6) return showMessage("A senha deve ter no mínimo 6 caracteres.", true);

      showMessage("Criando conta...");
      try {
        const { data, error } = await supabase.auth.signUp({ email: e, password: p });
        if (error) throw error;
        showMessage("Conta criada! Tente fazer login agora.");
      } catch (err) {
        showMessage("Erro no cadastro: " + err.message, true);
      }
    });
  }

  if (btnLogout) {
    btnLogout.addEventListener('click', async () => {
      console.log("🖱️ Botão Sair clicado!");
      await supabase.auth.signOut();
      window.location.reload();
    });
  }

  // 3. FUNÇÕES DO SISTEMA
  async function checkAuth() {
    try {
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;
      
      if (data && data.session) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('userEmail').textContent = data.session.user.email;
        loadDash();
      } else {
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
      }
    } catch (err) {
      console.error("Erro na verificação de autenticação:", err);
    }
  }

  async function loadDash() {
    try {
      const { data: prods } = await supabase.from('produtos').select('*');
      const { data: movs } = await supabase.from('movimentacoes').select('*').order('created_at', { ascending: false }).limit(8);
      const { data: reqs } = await supabase.from('requisicoes').select('*').eq('status', 'pendente');

      const total = prods ? prods.reduce((a, b) => a + (b.qtd || 0), 0) : 0;
      const valor = prods ? prods.reduce((a, b) => a + ((b.qtd || 0) * (b.preco_medio || 0)), 0) : 0;
      const crit = prods ? prods.filter(p => p.qtd <= (p.qtd_min || 0)).length : 0;

      document.getElementById('stats').innerHTML = `
        <div class="card"><div class="text-zinc-400 text-xs">Total Itens</div><div class="text-2xl font-bold">${total}</div></div>
        <div class="card"><div class="text-zinc-400 text-xs">Valor Estoque</div><div class="text-2xl font-bold">R$ ${valor.toFixed(2)}</div></div>
        <div class="card"><div class="text-zinc-400 text-xs">Críticos</div><div class="text-2xl font-bold text-red-400">${crit}</div></div>
        <div class="card"><div class="text-zinc-400 text-xs">Requisições</div><div class="text-2xl font-bold">${reqs ? reqs.length : 0}</div></div>
      `;

      if (movs && movs.length > 0) {
        document.getElementById('lista').innerHTML = movs.map(m => `
          <div class="border-b border-zinc-800 py-2 flex justify-between">
            <span>${(m.tipo || 'N/A').toUpperCase()} - ${m.sku || 'N/A'} - ${m.qtd || 0} un</span>
            <span class="text-zinc-500 text-xs">${new Date(m.created_at).toLocaleString()}</span>
          </div>
        `).join('');
      }
    } catch (err) {
      console.error("Erro ao carregar dashboard:", err);
    }
  }

  // Inicia a verificação
  checkAuth();
});
</script>
</body>
</html>

    <main class="p-4 max-w-7xl mx-auto"><h1 class="text-2xl font-bold mb-4">Compras Automaticas</h1><div class="card mb-4"><button onclick="verificar()" class="bg-green-600 px-6 py-2 rounded font-bold">Verificar Requisicoes</button><p class="text-xs text-zinc-400 mt-2">Busca recorrentes e estoque baixo e encontra melhor preco</p></div><div id="result" class="grid gap-2"></div><div class="card mt-4"><h2 class="font-bold">Pendentes</h2><div id="lista" class="mt-2 text-sm"></div></div><script>async function verificar(){const {data:prods}=await supabase.from('produtos').select('*');const {data:precos}=await supabase.from('fornecedor_precos').select('*');const {data:forns}=await supabase.from('fornecedores').select('*');const map=Object.fromEntries((forns||[]).map(f=>[f.id,f.nome]));const para=(prods||[]).filter(p=>p.recorrente||(p.qtd||0)<=(p.qtd_min||0));let html='';for(let prod of para){const opcoes=(precos||[]).filter(pr=>pr.produto_sku===prod.sku).sort((a,b)=>a.preco-b.preco);if(opcoes.length===0)continue;const melhor=opcoes[0];const media=opcoes.reduce((a,b)=>a+b.preco,0)/opcoes.length;html+=`<div class="card border border-green-800"><b>${prod.nome} (${prod.sku})</b> - Est ${prod.qtd} / Min ${prod.qtd_min}<br>Melhor: <b>${map[melhor.fornecedor_id]||''} - R$ ${melhor.preco}</b> media R$ ${media.toFixed(2)}<br><button onclick="gerar('${prod.sku}',10,'${map[melhor.fornecedor_id]||''}',${melhor.preco})" class="mt-2 bg-green-600 px-3 py-1 rounded text-sm">Gerar Pedido 10 un</button></div>`;}document.getElementById('result').innerHTML=html||'<div class=card>Nenhum precisa comprar</div>';loadReq();}async function gerar(sku,qtd,nome,preco){await supabase.from('requisicoes').insert({sku,qtd,fornecedor_nome:nome,preco,status:'pendente'});alert('Gerado!');loadReq();}async function loadReq(){const {data}=await supabase.from('requisicoes').select('*').order('created_at',{ascending:false});document.getElementById('lista').innerHTML=(data||[]).map(r=>`<div class="border-b border-zinc-800 py-1">${r.sku} - ${r.qtd} un - ${r.fornecedor_nome} - R$ ${r.preco} - ${r.status} <button onclick="aprovar('${r.id}')" class="ml-2 bg-zinc-700 px-2 py-0.5 rounded text-xs">Aprovar</button></div>`).join('');}async function aprovar(id){await supabase.from('requisicoes').update({status:'aprovado'}).eq('id',id);loadReq();}loadReq();</script></main><script>const SUPABASE_URL="https://zyjonbvxmsvgcexahusj.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5am9uYnZ4bXN2Z2NleGFodXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDg0ODEsImV4cCI6MjEwMjc4NDQ4MX0.5KrFCYI2Nv2U0dPqe6OmhxdCQLeI47wswNsgDqO4bok";const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function checkAuth(){const {data}=await supabase.auth.getSession();const el=document.getElementById('userInfo');if(data.session){el.textContent=data.session.user.email+' | Sair';el.onclick=async()=>{await supabase.auth.signOut();location.href='index.html';};el.classList.add('cursor-pointer');} else {el.textContent='Nao logado';}}checkAuth();</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>

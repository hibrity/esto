</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrada NF-e XML e PDF</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#09090b;color:#fafafa} .card{background:#18181b;border:1px solid #27272a;border-radius:12px;padding:16px}</style></head><body>

    <main class="p-4 max-w-7xl mx-auto"><h1 class="text-2xl font-bold mb-4">Entrada NF-e XML e PDF</h1><div class="card"><h2 class="font-bold mb-2">Upload NF-e (XML ou PDF)</h2><input type="file" id="file" accept=".xml,.pdf" class="mb-2"><div id="preview" class="text-sm mt-2"></div><button id="btnConf" style="display:none" onclick="confirmar()" class="mt-2 bg-green-600 px-4 py-2 rounded font-bold">Confirmar Entrada</button></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>let itens=[];document.getElementById('file').addEventListener('change',async(e)=>{const f=e.target.files[0];if(!f)return;if(f.name.endsWith('.xml')){const txt=await f.text();const parser=new DOMParser();const xml=parser.parseFromString(txt,'text/xml');const dets=xml.getElementsByTagName('det');itens=[];for(let d of dets){const xProd=d.getElementsByTagName('xProd')[0]?.textContent||'Produto';const qCom=parseFloat(d.getElementsByTagName('qCom')[0]?.textContent||1);const vUnCom=parseFloat(d.getElementsByTagName('vUnCom')[0]?.textContent||0);itens.push({sku:xProd.substring(0,20).toUpperCase().replace(/\s/g,'_'),nome:xProd,qtd:qCom,preco:vUnCom});}render();}else if(f.name.endsWith('.pdf')){const buf=await f.arrayBuffer();const pdf=await pdfjsLib.getDocument(buf).promise;let full='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const content=await page.getTextContent();full+=content.items.map(it=>it.str).join(' ')+'\n';}document.getElementById('preview').innerHTML='<pre class=text-xs bg-black p-2 rounded max-h-64 overflow-auto>'+full.substring(0,3000)+'</pre>';itens=[{sku:'ITEM_PDF_'+Date.now(),nome:'Item PDF (edite)',qtd:1,preco:0}];render();}});function render(){document.getElementById('preview').innerHTML+=itens.map((it,i)=>`<div class="flex gap-2 mt-1"><input value="${it.sku}" id="sku${i}" class="bg-zinc-900 border border-zinc-700 rounded p-1 w-32"><input value="${it.nome}" id="nome${i}" class="bg-zinc-900 border border-zinc-700 rounded p-1 flex-1"><input type=number value="${it.qtd}" id="qtd${i}" class="bg-zinc-900 border border-zinc-700 rounded p-1 w-16"><input type=number step=0.01 value="${it.preco}" id="preco${i}" class="bg-zinc-900 border border-zinc-700 rounded p-1 w-20"></div>`).join('');document.getElementById('btnConf').style.display='block';}async function confirmar(){const {data:{session}}=await supabase.auth.getSession();for(let i=0;i<itens.length;i++){const sku=document.getElementById('sku'+i).value,nome=document.getElementById('nome'+i).value,qtd=parseInt(document.getElementById('qtd'+i).value),preco=parseFloat(document.getElementById('preco'+i).value);const {data:ex}=await supabase.from('produtos').select('*').eq('sku',sku).single();if(ex){await supabase.from('produtos').update({qtd:(ex.qtd||0)+qtd,preco_medio:preco}).eq('sku',sku);}else{await supabase.from('produtos').insert({sku,nome,qtd,qtd_min:5,preco_medio:preco});}await supabase.from('movimentacoes').insert({tipo:'entrada',sku,qtd,motivo:'NF-e',user_email:session?.user?.email||'sistema'});}alert('Entrada confirmada!');location.href='produtos.html';}</script></main><script>const SUPABASE_URL="https://zyjonbvxmsvgcexahusj.supabase.co";const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5am9uYnZ4bXN2Z2NleGFodXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDg0ODEsImV4cCI6MjEwMjc4NDQ4MX0.5KrFCYI2Nv2U0dPqe6OmhxdCQLeI47wswNsgDqO4bok";const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function checkAuth(){const {data}=await supabase.auth.getSession();const el=document.getElementById('userInfo');if(data.session){el.textContent=data.session.user.email+' | Sair';el.onclick=async()=>{await supabase.auth.signOut();location.href='index.html';};el.classList.add('cursor-pointer');} else {el.textContent='Nao logado';}}checkAuth();</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
